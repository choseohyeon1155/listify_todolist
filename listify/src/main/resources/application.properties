spring.application.name=listify

spring.messages.basename=multi_lang/messages
spring.messages.encoding=UTF-8

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


# DB
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.datasource.url=jdbc:h2:~/base
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=mbc
#spring.datasource.password=
spring.datasource.url=jdbc:mysql://localhost:3306/listify?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=listify
spring.datasource.password=listify


#jpa
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true




server.port=8989

server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.servlet.jsp.init-parameters.development=true



